when:
  event: [push, manual]

steps:
  - name: setup-workspace
    image: alpine/git
    secrets: [github_token]
    commands:
      # Woodpecker clones COMPASS into the current dir
      # We need to add experimental_src inside it
      - git clone --depth 1 https://$${GITHUB_TOKEN}@github.com/hpuhr/experimental_src.git experimental_src

  - name: build
    image: compass/build_deb10
    commands:
      # Create the /app/workspace/compass symlink that the scripts expect
      - sudo mkdir -p /app/workspace
      - sudo ln -s "$CI_WORKSPACE" /app/workspace/compass
      # Now the existing scripts work unmodified
      - cd docker
      - ./build_jasterix.sh
      - ./build_compass.sh

  - name: test
    image: compass/build_deb10
    commands:
      - sudo mkdir -p /app/workspace
      - sudo ln -s "$CI_WORKSPACE" /app/workspace/compass
      - ./build_deb10/bin/compass_tests

  - name: appimage
    image: compass/build_deb10
    commands:
      - sudo mkdir -p /app/workspace
      - sudo ln -s "$CI_WORKSPACE" /app/workspace/compass
      - cd docker
      - ./deploy_compass.sh
