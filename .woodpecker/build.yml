when:
  - event: [push, manual]

steps:
  - name: setup-workspace
    image: alpine/git
    secrets:
      - github_token
    commands:
      - git clone --depth 1 --branch ${CI_COMMIT_BRANCH} https://$${GITHUB_TOKEN}@github.com/hpuhr/experimental_src.git experimental_src || git clone --depth 1 --branch devel https://$${GITHUB_TOKEN}@github.com/hpuhr/experimental_src.git experimental_src
      - git clone --depth 1 --branch devel https://github.com/hpuhr/jASTERIX.git ../jasterix

  - name: build
    image: compass/build_deb10
    commands:
      - bash -c 'set -e; sudo mkdir -p /app/workspace; sudo ln -sfn "$CI_WORKSPACE" /app/workspace/compass; sudo ln -sfn "$CI_WORKSPACE/../jasterix" /app/workspace/jasterix; ls -la /app/workspace/; ls /app/workspace/compass/CMakeLists.txt; ls /app/workspace/jasterix/CMakeLists.txt; cd /app/workspace/compass/docker && ./build_jasterix.sh && ./build_compass.sh'

  - name: test
    image: compass/build_deb10
    commands:
      - ./build_deb10/bin/compass_tests

  - name: appimage
    image: compass/build_deb10
    commands:
      - bash -c 'set -e; sudo mkdir -p /app/workspace; sudo ln -sfn "$CI_WORKSPACE" /app/workspace/compass; cd /app/workspace/compass/docker && ./deploy_compass.sh'
